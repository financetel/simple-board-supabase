<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f5f2" />
  <title>줄노트 게시판</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page" id="top">
    <header class="topbar">
      <a class="brand" href="#top">줄노트 게시판</a>
      <span class="status" id="connectionStatus">미리보기 모드</span>
    </header>

    <section class="write-section" id="write">
      <h1>글쓰기</h1>
      <form id="postForm" class="compose-card">
        <div class="compose-top">
          <span class="compose-date" id="todayDate"></span>
        </div>
        <label class="sr-only" for="content">내용</label>
        <textarea id="content" maxlength="500" placeholder="내용을 입력하세요." required></textarea>
        <div id="imagePreview" class="image-preview" hidden></div>
        <div class="compose-bottom">
          <div class="compose-tools">
            <label class="attach-button" for="photoInput">사진 첨부<input id="photoInput" type="file" accept="image/*" hidden /></label>
            <span class="photo-hint">최대 1장</span>
          </div>
          <div class="submit-side"><span id="charCount">0 / 500</span><button class="submit-button" type="submit">등록</button></div>
        </div>
      </form>
      <p class="demo-caption" id="modeInfo">작성한 글은 현재 브라우저에만 표시됩니다.</p>
    </section>

    <section class="notes-section">
      <div class="notes-header"><h2>게시글 <span id="totalLabel">05</span></h2><span class="sort-label">최신순</span></div>
      <p class="app-message" id="appMessage" role="status" aria-live="polite" hidden></p>
      <div id="notesList" class="notes-list"></div>
    </section>
    <footer>줄노트 게시판</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
